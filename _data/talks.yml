# Events and talks shown on /talks/ and on the location map (/map/).
# Keep each list ordered newest first: numbering counts down from the top.
#   date  - YYYY-MM-DD, drives the year grouping and the "Upcoming" badge
#   label - optional text replacing the displayed date (ranges, month only)
#   place - key in _data/places.yml (leave empty to keep it off the map)
#   details - optional; adds the talk to /talks/seminars/ with abstract and
#             speaker bios. Empty fields are left out.
#     id       - anchor on the seminars page (lowercase, dashes)
#     abstract - plain text or HTML
#     speakers - list of { name, url, affiliation, photo, bio }

organized:
  - date: 2026-12-16
    title: "EES research day 2026"
    kind: "Research day"
    place: eindhoven
  - date: 2026-10-28
    title: "A Brief Introduction to Bilevel Optimization and Its Applications in Energy Systems"
    kind: "Cross-sectoral talk"
    speakers: "Dr. <a href='https://www.tue.nl/en/research/researchers/yasmine-beck' target='_blank' rel='noopener noreferrer'>Yasmine Beck</a>"
    place: eindhoven
    details:
      id: bilevel-optimization
      abstract: "Bilevel optimization models hierarchical decision-making, where one decision-maker anticipates the response of another, as in infrastructure defense, transportation and energy systems. Its nested structure makes these problems hard to solve. The talk introduces the problem structure, its main properties and common reformulations and solution approaches, then shows how bilevel models capture hierarchical interactions in energy systems."
      speakers:
        - name: "Dr. Yasmine Beck"
          url: "https://www.tue.nl/en/research/researchers/yasmine-beck"
          affiliation: "Eindhoven University of Technology, Department of Industrial Engineering & Innovation Sciences, OPAC research group"
          bio: "Assistant Professor of Operations Management in the OPAC group at TU/e. After a PhD in Mathematical Optimization at Trier University (2024) and a postdoc at ESSEC Business School, Paris, she joined TU/e in 2026. She works on bilevel optimization and optimization under uncertainty, co-authored the book <em>Linear and Mixed-Integer Bilevel Optimization</em> and hosts the Bilevel Optimization Society Webinar Series. Her thesis received the EURO Doctoral Dissertation Award, the GOR Dissertation Award and the Helmut Kraaz-Förderpreis (all 2025)."
