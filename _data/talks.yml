    title: "Asset management from the Stedin engineering perspective"
    kind: "Industry perspective talk"
    speakers: "Daniël Booman, Torben Fricke and Deniz Sahin (Stedin)"
    note: "Flux 2.251, TU/e"
    place: eindhoven
    details:
      id: stedin-asset-management
      abstract: ""
      speakers:
        - name: "Daniël Booman"
          affiliation: "Stedin"
          bio: "Data Scientist in Asset Performance Management. Previously project coordinator, project leader and risk analyst at Stedin. BSc in Aerospace Engineering and MSc in Applied Sciences, TU Delft."
        - name: "Torben Fricke"
          affiliation: "Stedin"
          bio: "Grid Strategist in Asset Management, developing design guidelines and investment strategies for low-voltage capacity expansion. PhD on large salient-pole synchronous machines (Germany), then two IT scale-ups before Stedin."
        - name: "Deniz Sahin"
          affiliation: "Stedin"
          bio: "Data Scientist in Asset &amp; System Performance Management, supporting investment decisions on grid quality and reliability through data analysis and statistical modeling. Background in Econometrics."
